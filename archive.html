<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Archive</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>

/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* BODY */
body {
  font-family: 'Poppins', sans-serif;
  background: #E0CFC2;
  color: #2c2c2c;
}

/* NAV */
nav {
  display: flex;
  justify-content: space-between;
  padding: 20px 8%;
  background: #62191C;
  color: #E0CFC2;
}

nav ul {
  display: flex;
  gap: 20px;
  list-style: none;
}

nav a {
  color: #E0CFC2;
  text-decoration: none;
}

/* CONTENT */
.content {
  text-align: center;
  padding: 60px 20px 20px;
}

.content h2 {
  font-family: 'Playfair Display', serif;
  color: #62191C;
}

/* GRID */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 25px;
  padding: 40px 8%;
}

/* CARD */
.card {
  position: relative;
  overflow: hidden;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.4s;
}

.card img {
  width: 100%;
  height: 250px;
  object-fit: cover;
  display: block;
  transition: 0.4s;
}

.card:hover img {
  transform: scale(1.1);
}

/* OVERLAY */
.overlay {
  position: absolute;
  inset: 0;
  background: rgba(98,25,28,0.75);
  color: #E0CFC2;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  opacity: 0;
  transition: 0.4s;
  text-align: center;
  padding: 20px;
}

.card:hover .overlay {
  opacity: 1;
}

/* MODAL (TEXT ONLY) */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  z-index: 1000;
  padding: 60px 20px;
  overflow-y: auto;
}

/* MODAL CONTENT BOX */
.modal-inner {
  max-width: 800px;
  margin: auto;
  color: white;
}

/* TITLE */
#modal-caption {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  margin-bottom: 20px;
  text-align: center;
}

/* ESSAY */
#modal-essay {
  font-size: 15px;
  line-height: 1.8;
  color: #e6e6e6;
  text-align: justify;
}

/* CLOSE BUTTON */
.close {
  position: fixed;
  top: 20px;
  right: 30px;
  font-size: 30px;
  color: white;
  cursor: pointer;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 20px;
  background: #62191C;
  color: #E0CFC2;
}

</style>
</head>

<body>

<nav>
  <h1>Ephemeral Delhi</h1>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="archive.html">Archive</a></li>
    <li><a href="map.html">Map</a></li>
    <li><a href="analysis.html">Analysis</a></li>
    <li><a href="Contact.html">Contact Us</a></li>
  </ul>
</nav>

<section class="content">
  <h2>Archive</h2>
  <p>Each entry captures a structure that briefly transformed space.</p>
</section>

<section class="gallery">

<!-- CARD 1 -->
<div class="card" onclick="openModal(this)"
data-title="Wedding Tent"
data-essay="A wedding tent in Delhi becomes a temporary world of celebration, aspiration, and memory. It transforms ordinary space into something ceremonial before disappearing without trace.">

  <img src="images/wedding.jpg">
  <div class="overlay">
    <h3>Wedding Tent</h3>
    <p>Fleeting celebration space</p>
  </div>
</div>

<!-- CARD 2 -->
<div class="card" onclick="openModal(this)"
data-title="Protest Stage"
data-essay="A protest stage asserts visibility and collective voice, turning public space into a site of resistance before dissolving back into the city.">

  <img src="images/protest.jpg">
  <div class="overlay">
    <h3>Protest Stage</h3>
    <p>Space of resistance</p>
  </div>
</div>

<!-- CARD 3 -->
<div class="card" onclick="openModal(this)"
data-title="Durga Puja Pandal"
data-essay="A pandal is a temporary sacred architecture where devotion and spectacle merge before vanishing after the festival cycle.">

  <img src="images/pandal.jpg">
  <div class="overlay">
    <h3>Pandal</h3>
    <p>Festival architecture</p>
  </div>
</div>

</section>

<!-- MODAL -->
<div id="modal" class="modal">

  <span class="close" onclick="closeModal()">&times;</span>

  <div class="modal-inner">
    <div id="modal-caption"></div>
    <div id="modal-essay"></div>
  </div>

</div>

<footer>
Ephemeral Delhi — Archive
</footer>

<script>

/* OPEN MODAL (TEXT ONLY) */
function openModal(card) {
  document.getElementById("modal").style.display = "block";

  document.getElementById("modal-caption").innerText =
    card.dataset.title;

  document.getElementById("modal-essay").innerText =
    card.dataset.essay;
}

/* CLOSE MODAL */
function closeModal() {
  document.getElementById("modal").style.display = "none";
}

</script>

</body>
</html>
